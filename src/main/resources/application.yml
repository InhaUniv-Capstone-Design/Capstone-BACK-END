spring:
  config:
    import: optional:application-local.yml
  application:
    name: yakyeon
  datasource:
    url: jdbc:postgresql://localhost:5432/yakyeon
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_최소32바이트이상의랜덤문자열로교체하세요1234567890}
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG