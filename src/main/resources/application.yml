spring:
  config:
    import: optional:application-local.yml
  application:
    name: yakyeon
  datasource:
    url: jdbc:postgresql://localhost:5432/yakyeon
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      # API Gateway(HTTP API)의 요청 본문 한도가 10MB라서, 그보다 작게 둬서 우리 서버가 먼저 JSON 오류로 거절하게 한다
      max-file-size: 8MB
      max-request-size: 9MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600

encryption:
  phone-key: ${PHONE_ENCRYPTION_KEY:}

server:
  port: 8080

# 가입 문자 인증 방식
#  mock  : (기본, 개발용) 인증번호를 서버 로그에 남기고 사용자가 입력한다
#  octomo: 사용자가 인증번호를 자기 휴대폰에서 OCTOMO 대표번호로 문자로 보내고, 서버가 OCTOMO에 조회한다
phone-verification:
  provider: ${PHONE_VERIFICATION_PROVIDER:mock}

octomo:
  api-key: ${OCTOMO_API_KEY:}              # 옥토모 마이페이지의 API Key. 파일에 적지 말고 환경변수로만 넣는다
  base-url: https://api.octoverse.kr/octomo/v1
  representative-number: "16663538"        # 사용자가 문자를 보낼 대표번호(1666-3538)
  daily-call-limit: 300                    # 하루 호출 한도. 무료 플랜 월 10,000건을 넘지 않게 한다 (0이면 제한 없음)

# 문자 발송 방식(옛 보호자 연동 방식용). 실제 서버에서는 disabled로 둬서 인증번호를 로그에 남기는 mock을 쓰지 않는다
sms:
  provider: ${SMS_PROVIDER:mock}

# 공개 API의 접속 주소별 호출 제한 (시험할 때만 false)
rate-limit:
  enabled: true

# 탈퇴 데이터 파기 (탈퇴한 사람의 건강기록을 보관 기간 뒤에 실제로 삭제한다. 10분마다 점검)
privacy:
  purge:
    enabled: true                  # false면 파기를 하지 않는다 (탈퇴해도 건강기록이 남는다)
    dry-run: false                 # true면 지우지 않고 지울 건수만 로그에 남긴다 (처음 배포할 때 건수 확인용)
    patient-retention-days: 0      # 복약자 본인 탈퇴 후 삭제까지 (0 = 다음 점검 때 바로)
    guardian-retention-days: 30    # 대리인 탈퇴 후 계정 행 보관 (이 동안의 연동 기록이 아래 보관 기간의 시계가 된다)
    abandoned-patient-days: 30     # 관리하는 대리인이 모두 탈퇴한 앱 계정 없는 복약자의 기록 보관 (대리인 보관 일수를 넘지 못한다)
    batch-limit: 200               # 한 번에 정리하는 관리자 없는 복약자 수

# 로그인 연속 실패 잠금 (비밀번호를 연속으로 틀리면 계정을 잠시 잠가서 비밀번호를 끝없이 시도하는 공격을 막는다)
auth:
  login-lock:
    enabled: true      # false면 잠금을 끈다
    max-failures: 5    # 이 횟수만큼 연속으로 틀리면 잠근다 (2~20)
    minutes: 15        # 잠금 시간(분, 1~1440)